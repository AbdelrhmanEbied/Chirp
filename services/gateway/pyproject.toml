[project]
name = "chirp-gateway-service"
version = "0.1.0"
description = "API gateway and BFF for Chirp."
requires-python = ">=3.12"
dependencies = ["chirp-common", "uvicorn[standard]>=0.30", "httpx>=0.27", "redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

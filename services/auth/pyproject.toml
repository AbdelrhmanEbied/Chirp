[project]
name = "chirp-auth-service"
version = "0.1.0"
description = "Credentials, sessions and token issuance for Chirp."
requires-python = ">=3.12"
dependencies = [
  "chirp-common",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

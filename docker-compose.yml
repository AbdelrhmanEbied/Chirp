# Local development topology.
#
# Deliberately NOT a production topology. One PostgreSQL server holds one
# database per service, one Redis serves cache and the event bus on separate
# logical databases, and there is no ingress, TLS or autoscaling. Those are
# the deployment concerns this repository leaves to you.
#
# Migrations run as one-shot containers that the API containers wait on
# (service_completed_successfully), which is the Compose equivalent of a
# Kubernetes Job in an init phase. Nothing in an application container runs
# migrations at boot, so scaling an API to N replicas does not race N
# migrations against each other.

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-chirp.auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-chirp.api}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-2097152}
  REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
  EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-redis}
  EVENT_BUS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/1
  EVENT_STREAM_PREFIX: ${EVENT_STREAM_PREFIX:-chirp.events}
  EVENT_MAX_DELIVERY_ATTEMPTS: ${EVENT_MAX_DELIVERY_ATTEMPTS:-5}
  EVENT_CLAIM_IDLE_MS: ${EVENT_CLAIM_IDLE_MS:-60000}
  EVENT_BATCH_SIZE: ${EVENT_BATCH_SIZE:-32}
  EVENT_MAX_STREAM_LENGTH: ${EVENT_MAX_STREAM_LENGTH:-100000}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-60}

x-restart: &restart
  restart: unless-stopped

services:
  # ----------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chirp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} && psql -U $${POSTGRES_USER} -lqt | grep -qw chirp_moderation"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------- auth
  auth-migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_auth
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_auth
      USER_SERVICE_URL: http://user:8002
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- user
  user-migrate:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_user
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_user
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  user-worker:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_user
    command: ["python", "-m", "app.worker"]
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- post
  post-migrate:
    build:
      context: .
      dockerfile: services/post/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_post
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  post:
    build:
      context: .
      dockerfile: services/post/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: post-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_post
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      post-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  post-worker:
    build:
      context: .
      dockerfile: services/post/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: post-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_post
    command: ["python", "-m", "app.worker"]
    depends_on:
      post-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- graph
  graph-migrate:
    build:
      context: .
      dockerfile: services/graph/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_graph
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  graph:
    build:
      context: .
      dockerfile: services/graph/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: graph-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_graph
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      graph-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- timeline
  timeline-migrate:
    build:
      context: .
      dockerfile: services/timeline/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_timeline
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  timeline:
    build:
      context: .
      dockerfile: services/timeline/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: timeline-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_timeline
      POST_SERVICE_URL: http://post:8003
      GRAPH_SERVICE_URL: http://graph:8004
      USER_SERVICE_URL: http://user:8002
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      timeline-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- search
  search-migrate:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_search
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: search-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_search
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      search-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  search-worker:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: search-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_search
    command: ["python", "-m", "app.worker"]
    depends_on:
      search-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- notification
  notification-migrate:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_notification
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_notification
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_notification
    command: ["python", "-m", "app.worker"]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- messaging
  messaging-migrate:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_messaging
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: messaging-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_messaging
      GRAPH_SERVICE_URL: http://graph:8004
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      messaging-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- media
  media-migrate:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_media
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: media-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_media
    ports:
      - "127.0.0.1:8009:8009"
    depends_on:
      media-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media-uploads:/srv/uploads

  # ----------------------------------------------------------------- moderation
  moderation-migrate:
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_moderation
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  moderation:
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: moderation-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/chirp_moderation
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      moderation-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------- gateway
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      AUTH_SERVICE_URL: http://auth:8001
      USER_SERVICE_URL: http://user:8002
      POST_SERVICE_URL: http://post:8003
      GRAPH_SERVICE_URL: http://graph:8004
      TIMELINE_SERVICE_URL: http://timeline:8005
      SEARCH_SERVICE_URL: http://search:8006
      NOTIFICATION_SERVICE_URL: http://notification:8007
      MESSAGING_SERVICE_URL: http://messaging:8008
      MEDIA_SERVICE_URL: http://media:8009
      MODERATION_SERVICE_URL: http://moderation:8010
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      post:
        condition: service_started
      graph:
        condition: service_started
      timeline:
        condition: service_started
      search:
        condition: service_started
      notification:
        condition: service_started
      messaging:
        condition: service_started
      media:
        condition: service_started
      moderation:
        condition: service_started

  # ----------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  media-uploads:
  prometheus-data:
  grafana-data:

apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  namespace: chirp-prod
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for RDS to be reachable..."
              for i in $(seq 1 30); do
                pg_isready -h "$RDS_HOST" -p "$RDS_PORT" -U chirp_admin 2>/dev/null && break
                echo "  Attempt $i/30..."
                sleep 5
              done

              DBS="chirp_auth chirp_user chirp_post chirp_graph chirp_timeline chirp_search chirp_notification chirp_messaging chirp_media chirp_moderation"
              for db in $DBS; do
                echo "Checking database: $db"
                EXISTS=$(psql "postgresql://chirp_admin:${POSTGRES_PASSWORD}@${RDS_HOST}:${RDS_PORT}/postgres?sslmode=require" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" 2>/dev/null)
                if [ "$EXISTS" != "1" ]; then
                  echo "  Creating database: $db"
                  psql "postgresql://chirp_admin:${POSTGRES_PASSWORD}@${RDS_HOST}:${RDS_PORT}/postgres?sslmode=require" -c "CREATE DATABASE $db;"
                else
                  echo "  Already exists: $db"
                fi
              done
              echo "All databases ready"
          env:
            - name: RDS_HOST
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: RDS_HOST
            - name: RDS_PORT
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: RDS_PORT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: POSTGRES_PASSWORD

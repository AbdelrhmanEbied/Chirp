apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation
  namespace: chirp-prod
  labels:
    app: moderation
    service: moderation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moderation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: moderation
    spec:
      containers:
        - name: moderation
          image: chirp/moderation:latest
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "moderation-service"
            - name: PORT
              value: "8010"
            - name: DB_APPLICATION_NAME
              value: "moderation-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_MODERATION
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 5

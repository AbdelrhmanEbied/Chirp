apiVersion: batch/v1
kind: Job
metadata:
  name: moderation-migrate
  namespace: chirp-prod
  labels:
    app: moderation
spec:
  template:
    metadata:
      labels:
        app: moderation
    spec:
      containers:
        - name: moderation-migrate
          image: chirp/moderation:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "moderation-service"
            - name: PORT
              value: "8010"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_MODERATION
      workingDir: /srv/service
      restartPolicy: Never
  backoffLimit: 3

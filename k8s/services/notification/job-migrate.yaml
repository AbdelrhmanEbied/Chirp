apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migrate
  namespace: chirp-prod
  labels:
    app: notification
spec:
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification-migrate
          image: chirp/notification:latest
          workingDir: /srv/service
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: PORT
              value: "8007"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_NOTIFICATION
      restartPolicy: Never
  backoffLimit: 3

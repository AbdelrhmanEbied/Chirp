apiVersion: batch/v1
kind: Job
metadata:
  name: search-migrate
  namespace: chirp-prod
  labels:
    app: search
spec:
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search-migrate
          image: chirp/search:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "search-service"
            - name: PORT
              value: "8006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_SEARCH
      restartPolicy: Never
  backoffLimit: 3

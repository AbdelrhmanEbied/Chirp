apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: chirp-prod
  labels:
    app: auth
spec:
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-migrate
          image: chirp/auth:latest
          workingDir: /srv/service
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "auth-service"
            - name: PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_AUTH
      restartPolicy: Never
  backoffLimit: 3

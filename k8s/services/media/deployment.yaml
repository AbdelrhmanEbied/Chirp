apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  namespace: chirp-prod
  labels:
    app: media
    service: media
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: media
          image: chirp/media:latest
          ports:
            - containerPort: 8009
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "media-service"
            - name: PORT
              value: "8009"
            - name: DB_APPLICATION_NAME
              value: "media-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_MEDIA
            - name: AWS_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: AWS_ROLE_ARN
                  optional: true
          volumeMounts:
            - name: uploads
              mountPath: /srv/uploads
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: uploads
          emptyDir: {}

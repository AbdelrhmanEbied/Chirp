apiVersion: apps/v1
kind: Deployment
metadata:
  name: post
  namespace: chirp-prod
  labels:
    app: post
    service: post
spec:
  replicas: 2
  selector:
    matchLabels:
      app: post
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: post
    spec:
      containers:
        - name: post
          image: chirp/post:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "post-service"
            - name: PORT
              value: "8003"
            - name: DB_APPLICATION_NAME
              value: "post-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_POST
            - name: USER_SERVICE_URL
              value: "http://user-svc.chirp-prod.svc.cluster.local:8002"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-worker
  namespace: chirp-prod
  labels:
    app: post-worker
    service: post
spec:
  replicas: 2
  selector:
    matchLabels:
      app: post-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: post-worker
    spec:
      containers:
        - name: post-worker
          image: chirp/post:latest
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "post-service"
            - name: PORT
              value: "8003"
            - name: DB_APPLICATION_NAME
              value: "post-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_POST
            - name: USER_SERVICE_URL
              value: "http://user-svc.chirp-prod.svc.cluster.local:8002"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5

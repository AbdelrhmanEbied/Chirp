apiVersion: batch/v1
kind: Job
metadata:
  name: post-migrate
  namespace: chirp-prod
  labels:
    app: post
spec:
  template:
    metadata:
      labels:
        app: post
    spec:
      containers:
        - name: post-migrate
          image: chirp/post:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "post-service"
            - name: PORT
              value: "8003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_POST
      restartPolicy: Never
  backoffLimit: 3

apiVersion: batch/v1
kind: Job
metadata:
  name: graph-migrate
  namespace: chirp-prod
  labels:
    app: graph
spec:
  template:
    metadata:
      labels:
        app: graph
    spec:
      containers:
        - name: graph-migrate
          image: chirp/graph:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "graph-service"
            - name: PORT
              value: "8004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chirp-secrets
                  key: DATABASE_URL_GRAPH
      restartPolicy: Never
  backoffLimit: 3

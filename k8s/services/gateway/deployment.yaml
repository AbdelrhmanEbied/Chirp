apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chirp-prod
  labels:
    app: gateway
    service: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: chirp/gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chirp-config
            - secretRef:
                name: chirp-secrets
          env:
            - name: SERVICE_NAME
              value: "gateway-service"
            - name: PORT
              value: "8000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-svc.chirp-prod.svc.cluster.local:8001"
            - name: USER_SERVICE_URL
              value: "http://user-svc.chirp-prod.svc.cluster.local:8002"
            - name: POST_SERVICE_URL
              value: "http://post-svc.chirp-prod.svc.cluster.local:8003"
            - name: GRAPH_SERVICE_URL
              value: "http://graph-svc.chirp-prod.svc.cluster.local:8004"
            - name: TIMELINE_SERVICE_URL
              value: "http://timeline-svc.chirp-prod.svc.cluster.local:8005"
            - name: SEARCH_SERVICE_URL
              value: "http://search-svc.chirp-prod.svc.cluster.local:8006"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-svc.chirp-prod.svc.cluster.local:8007"
            - name: MESSAGING_SERVICE_URL
              value: "http://messaging-svc.chirp-prod.svc.cluster.local:8008"
            - name: MEDIA_SERVICE_URL
              value: "http://media-svc.chirp-prod.svc.cluster.local:8009"
            - name: MODERATION_SERVICE_URL
              value: "http://moderation-svc.chirp-prod.svc.cluster.local:8010"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

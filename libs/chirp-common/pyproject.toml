[project]
name = "chirp-common"
version = "0.1.0"
description = "Shared platform library for Chirp services: config, logging, errors, events, auth, db, metrics."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "prometheus-client>=0.21",
  "pyjwt>=2.9",
  "python-json-logger>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chirp_common"]
